name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # t133: tag-triggered lane — explicit cap instead of the 360-min GHA
    # default. Observed successful publishes: ~1.5 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: cachix/install-nix-action@v31.10.6
      - run: nix develop -c just install
      - run: nix develop -c just release-check
      - run: nix develop -c corepack pnpm exec changeset publish --no-git-tag
